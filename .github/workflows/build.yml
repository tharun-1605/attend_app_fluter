name: Build APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: attendance_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ✅ Do not fail pipeline for warnings
      - name: Verify formatting and analyze
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      # ✅ Debug: confirm APK exists
      - name: Check APK exists
        run: ls -R build/app/outputs/flutter-apk

      # ✅ FIXED upload (more reliable)
      - name: Upload APK to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: build/app/outputs/flutter-apk/app-release.apk
          tag: ${{ github.ref_name }}
          generateReleaseNotes: true