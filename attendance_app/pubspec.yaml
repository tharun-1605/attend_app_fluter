name: attendance_app
description: "Employee attendance system with face recognition"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.4

  # Face Recognition & Camera
  google_mlkit_face_detection: ^0.12.0
  camera: ^0.11.1
  image_picker: ^1.1.2
  
  # Location
  geolocator: ^13.0.2
  
  # Permissions
  permission_handler: ^11.4.0
  
  # Storage & Files
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  
  # State Management
  provider: ^6.1.5
  
  # Notifications
  flutter_local_notifications: ^19.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/
    - assets/images/
